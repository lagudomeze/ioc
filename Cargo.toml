[workspace]
members = [
    "crates/*",
    "libs/*",
    "utils/*"
]
resolver = "2"

[workspace.package]
version = "0.1.1"
rust-version = "1.80"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["ybiao"]
repository = "https://github.com/lagudomeze/ioc"

[workspace.dependencies]
cfg-rs = { version = "0.4", features = ["full"] }
env_logger = { version = "0.11" }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3" }
anyhow = "1"
crossbeam-epoch = "0.9"
log = "0.4"
thiserror = "1"
proc-macro2 = "1"
quote = "1"
serde = { version = "1" }
toml = "0.8"
poem = { version = "3" }
poem-openapi = { version = "5" }
prettyplease = { version = "0.2" }
darling = { version = "0.20" }
proc-macro-crate = { version = "3" }
cargo_metadata = { version = "0.18" }
ioc = { path = "libs/ioc" }
ioc_macro = { path = "libs/ioc_macro", default-features = false }
ioc_core = { path = "crates/core" }
ioc_core_macro = { path = "crates/core_macro" }
ioc_core_scan = { path = "crates/core_scan" }
ioc_mvc = { path = "crates/mvc" }
ioc_mvc_macro = { path = "crates/mvc_macro" }
ioc_mvc_scan = { path = "crates/mvc_scan" }
# boot
boot_core = { path = "libs/boot_core" }
boot_build = { path = "libs/boot_build" }
boot_macro = { path = "libs/boot_macro" }
# utils
visit = { path = "utils/visit" }

[workspace.dependencies.syn]
version = "2"
features = [
    "extra-traits",
    "derive",
    "parsing",
    "printing",
    "clone-impls",
    "proc-macro",
]
